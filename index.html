<!doctype html>
<!-- 23 nov 2026 ("quítala"): página propia de PokeTracker. Muestra la app por dentro para que Google no ponga su franja
     "This application was created by a Google Apps Script user".
     El link del motor NO está escrito aquí (esta página vive en un repo público): viaja en el enlace, después del #
     (.../poketracker-pagina/#AKfycb...), y la página lo recuerda. Lo que va después del # nunca llega a GitHub. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokeTracker</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1b1c21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokeTracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" href="icono.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1b1c21; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden;
           padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #1b1c21; }
  iframe.lista { visibility: visible; }
  main { color: #e8e8ec; font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center;
         padding: 40vh 24px 0; text-wrap: balance; }
  main p { margin: 0 0 8px; }
  main small { color: #a4a6ae; font-size: 14px; }
  main button { margin-top: 16px; font: inherit; color: #1b1c21; background: #e8e8ec; border: 0;
                border-radius: 8px; padding: 10px 22px; cursor: pointer; }
</style>
</head>
<body>
<main role="status" id="aviso"><p>Cargando PokeTracker…</p></main>
<script>
(function () {
  var CLAVE = 'pt-motor', id = (location.hash || '').slice(1), aviso = document.getElementById('aviso');
  var bueno = function (x) { return /^AKfycb[\w-]{20,}$/.test(x || ''); };
  var decir = function (texto, pista, boton) {
    aviso.innerHTML = '';
    var p = document.createElement('p'); p.textContent = texto; aviso.appendChild(p);
    if (pista) { var s = document.createElement('small'); s.textContent = pista; aviso.appendChild(s); }
    if (boton) { var b = document.createElement('button'); b.textContent = 'Reintentar'; b.onclick = function () { location.reload(); }; aviso.appendChild(document.createElement('br')); aviso.appendChild(b); }
  };
  try { if (bueno(id)) localStorage.setItem(CLAVE, id); else id = localStorage.getItem(CLAVE); } catch (e) {}
  if (!bueno(id)) {
    decir('Abre PokeTracker con el enlace completo que te enviaron.',
          'Después, en Safari: Compartir → Agregar a pantalla de inicio.');
    return;
  }
  // Revisión 23 nov: solo abre NUESTRO motor (un link con otro motor podría pedir la sesión guardada). Se compara su
  // huella SHA-256, así el link del motor sigue sin estar escrito aquí. Si se cambia de motor: actualizar MOTOR.
  var MOTOR = 'a9962522a857fa986a799889364febfaf6f048d55fc24e189e930ceb49a8e7ab';
  if (!(window.crypto && crypto.subtle && window.TextEncoder)) return decir('Este navegador no puede abrir PokeTracker.', 'Usa Safari o Chrome actualizados.');
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(id)).then(function (h) {
    var hex = Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    if (hex !== MOTOR) {
      try { localStorage.removeItem(CLAVE); } catch (e) {}
      return decir('Este enlace no es de PokeTracker.', 'Ábrelo con el enlace completo que te enviaron.');
    }
    abrir();
  });
  function abrir() {
  // 23 nov 2026 ("no se queda guardado el usuario en mi celu"): el iPhone borra lo que guarda el cuadro de Google al
  // cerrar la app. La app le pasa aquí su sesión (guardar / olvidar) y al abrir la pide. Solo se atiende a Google.
  // 23 nov ("apertura al instante"): también guarda UNA copia de lo último que vio (pt-datos, se reemplaza, nunca se
  // acumula) para pintarla al abrir mientras se trae lo nuevo. Se borra al cerrar sesión.
  var SES = 'pt-sesion', DATOS = 'pt-datos';
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(ev.origin) || !d || typeof d.ptPagina !== 'string' || !ev.source) return;
    // Solo la app que va dentro de NUESTRO cuadro (otra página de Google no puede pedir ni borrar la sesión).
    var w = ev.source, nuestra = false;
    try { for (var i = 0; i < 5 && w; i++) { if (f && w === f.contentWindow) { nuestra = true; break; } if (w === w.parent) break; w = w.parent; } } catch (e) { }
    if (!nuestra || window.top !== window) return;
    try {
      if (d.ptPagina === 'guardar' && d.ses && typeof d.ses.token === 'string') {
        localStorage.setItem(SES, JSON.stringify(d.ses));
        var dt = localStorage.getItem(DATOS);   // la copia de OTRA cuenta no se queda
        if (dt && dt.indexOf('{"v":1,"u":' + JSON.stringify(d.ses.usuario) + ',') !== 0) localStorage.removeItem(DATOS);
      }
      else if (d.ptPagina === 'guardarDatos' && typeof d.datos === 'string') {
        try { localStorage.setItem(DATOS, d.datos); } catch (e) { localStorage.removeItem(DATOS); return; }   // sin espacio: sin copia
        ev.source.postMessage({ ptPagina: 'datosGuardados', n: d.n }, ev.origin);   // 24 nov: la app da la copia por guardada solo con esto
      }
      else if (d.ptPagina === 'olvidar') { localStorage.removeItem(SES); localStorage.removeItem(DATOS); }
      else if (d.ptPagina === 'pedir') ev.source.postMessage({ ptPagina: 'sesion', ses: JSON.parse(localStorage.getItem(SES) || 'null'), datos: localStorage.getItem(DATOS) }, ev.origin);
    } catch (e) { /* sin memoria: la app pide entrar */ }
  });
  var f = document.createElement('iframe');
  f.title = 'PokeTracker';
  f.allow = 'clipboard-write';
  // Si en 20 s no carga nada (sin internet o Google caído), se dice y se ofrece reintentar.
  var espera = setTimeout(function () { decir('No se pudo abrir PokeTracker.', 'Revisa tu conexión a internet.', true); }, 20000);
  f.onload = function () { clearTimeout(espera); f.className = 'lista'; };
  f.src = 'https://script.google.com/macros/s/' + id + '/exec?app=1';
  document.body.appendChild(f);
  }
})();
</script>
</body>
</html>
